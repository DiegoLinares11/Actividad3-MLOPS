[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "act3-pipeline"
version = "0.1.0"
description = "Calibracion de hiperparametros de un pipeline de scikit-learn (Actividad 3 - MLE/MLOps, UVG)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Diego Linares", email = "lin221256@uvg.edu.gt" },
]
keywords = ["scikit-learn", "pipeline", "hyperparameter-tuning", "mlops", "crisp-dm"]
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
notebook = ["jupyter", "notebook", "matplotlib"]
dev = ["pytest>=7", "build"]

[project.urls]
Repository = "https://github.com/DiegoLinares11/Actividad3-MLOPS"

[project.scripts]
act3-demo = "act3_pipeline.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"act3_pipeline" = ["datasets/*.csv"]
